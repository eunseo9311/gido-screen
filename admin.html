<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>기도 승인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 담당자용: 위에 요약·탭, 아래로 기도 카드 목록 */
:root {
  --bg: #f3f5f9;
  --paper: #ffffff;
  --ink: #232b3a;
  --muted: #5f6879;
  --line: #dce1ea;
  --accent: #02368c;
  --accent-ink: #ffffff;
  --ok: #e5004f;
  --warn: #a8622a;
  --font-display: "Gowun Batang", "Nanum Myeongjo", serif;
  --font-body: "Noto Sans KR", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0f2c; --paper: #121a42; --ink: #eef1f8; --muted: #a7b0c6; --line: #26305c;
    --accent: #86a8f2; --accent-ink: #0a0f2c; --ok: #ff4f86; --warn: #e3a36a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a0f2c; --paper: #121a42; --ink: #eef1f8; --muted: #a7b0c6; --line: #26305c;
    --accent: #86a8f2; --accent-ink: #0a0f2c; --ok: #ff4f86; --warn: #e3a36a; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
h1, h2, p, label { word-break: keep-all; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.6 var(--font-body); padding: 24px 16px 48px; }
main { max-width: 56rem; margin: 0 auto; display: grid; gap: 20px; }
.brand { display: flex; align-items: center; gap: 14px; }
.logo img { display: block; height: 28px; width: auto; }
h1 { font: 700 26px var(--font-display); margin: 0; }
.top { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.links { display: flex; flex-wrap: wrap; gap: 8px; }
a.btn, button { font: 500 15px var(--font-body); border-radius: 10px; padding: 9px 14px; cursor: pointer; text-decoration: none; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.ok { background: var(--ok); color: #fff; border-color: var(--ok); font-weight: 700; }
button:disabled { opacity: .5; cursor: default; }
button:focus-visible, a:focus-visible, textarea:focus, input:focus { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 1px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.tab { border-radius: 999px; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.badge { display: inline-block; min-width: 1.6em; padding: 0 6px; margin-left: 4px; border-radius: 999px; background: color-mix(in srgb, var(--warn) 22%, transparent); font-variant-numeric: tabular-nums; font-size: 13px; text-align: center; }
.list { display: grid; gap: 12px; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 10px; }
.card[data-status="pending"] { border-left: 4px solid var(--warn); }
.card[data-status="approved"] { border-left: 4px solid var(--ok); }
.meta { display: flex; gap: 10px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
.meta b { color: var(--ink); }
.card textarea { width: 100%; min-height: 5.5rem; font: 18px/1.7 var(--font-display); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; resize: vertical; }
.card input { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; width: 12rem; max-width: 100%; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.empty { color: var(--muted); padding: 32px 0; text-align: center; }
.login { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 12px; max-width: 24rem; }
.login input { font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); width: 100%; }
.error { color: #c0392b; margin: 0; }
.bulk { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 14px; color: var(--muted); }
.demo { font-size: 13px; background: color-mix(in srgb, var(--warn) 18%, transparent); padding: 8px 12px; border-radius: 10px; margin: 0; }
</style>
</head>
<body>
<main>
  <div class="top">
    <div class="brand"><picture class="logo">
        <source srcset="logo-sarang-light.png" media="(prefers-color-scheme: dark)">
        <img src="logo-sarang.png" alt="사랑의교회" width="168" height="44">
      </picture><h1>기도 승인</h1></div>
    <div class="links">
      <a class="btn" href="screen" target="_blank" rel="noopener">송출 화면 열기</a>
      <a class="btn" href="./" target="_blank" rel="noopener">성도용 페이지</a>
      <button id="logout" type="button" hidden>로그아웃</button>
    </div>
  </div>
  <p class="demo" id="demo" hidden>체험 모드입니다. 같은 브라우저의 다른 탭과만 공유됩니다.</p>

  <form class="login" id="login" hidden>
    <strong>담당자 로그인</strong>
    <input id="email" type="email" placeholder="이메일" autocomplete="username" required>
    <input id="password" type="password" placeholder="비밀번호" autocomplete="current-password" required>
    <p class="error" id="loginError" hidden></p>
    <button class="primary" type="submit">로그인</button>
  </form>

  <section id="panel" hidden>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="pending" aria-selected="true">확인 대기<span class="badge" id="n-pending">0</span></button>
      <button class="tab" role="tab" data-tab="approved" aria-selected="false">송출 중<span class="badge" id="n-approved">0</span></button>
      <button class="tab" role="tab" data-tab="hidden" aria-selected="false">숨김<span class="badge" id="n-hidden">0</span></button>
      <button class="tab" role="tab" data-tab="done" aria-selected="false">지난 기도<span class="badge" id="n-done">0</span></button>
    </div>
    <div class="bulk" id="bulk" hidden>
      <span>예배가 끝나면 송출 목록을 비워 다음 예배를 준비하세요.</span>
      <button id="clear" type="button">송출 목록 비우기</button>
      <button id="clearYes" type="button" class="primary" hidden>네, 모두 지난 기도로 옮기기</button>
    </div>
    <p class="error" id="listError" hidden></p>
    <div class="list" id="list"></div>
  </section>
</main>

<script type="module">
import store, { isDemo, MAX_TEXT, MAX_NAME } from "./store.js";

const $ = (id) => document.getElementById(id);
let tab = "pending", all = [], unwatch = null;
const edits = new Map(); // 편집 중인 글을 목록 갱신 때 잃지 않도록 보관
$("demo").hidden = !isDemo;

const LABEL = { pending: "확인 대기", approved: "송출 중", hidden: "숨김", done: "지난 기도" };
const fmt = (ms) => new Date(ms).toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });

store.onAuth((user) => {
  const signedIn = !!user;
  $("login").hidden = signedIn;
  $("panel").hidden = !signedIn;
  $("logout").hidden = !signedIn || isDemo;
  if (unwatch) { unwatch(); unwatch = null; }
  if (signedIn) {
    unwatch = store.watchAll((list) => { all = list; $("listError").hidden = true; render(); }, (err) => {
      console.error(err);
      $("listError").textContent = "목록을 불러오지 못했습니다. 담당자 계정인지 확인해 주세요.";
      $("listError").hidden = false;
    });
  }
});

$("login").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("loginError").hidden = true;
  try { await store.signIn($("email").value.trim(), $("password").value); }
  catch { $("loginError").textContent = "이메일 또는 비밀번호가 맞지 않습니다."; $("loginError").hidden = false; }
});
$("logout").addEventListener("click", () => store.signOut());

document.querySelectorAll(".tab").forEach((b) => b.addEventListener("click", () => {
  tab = b.dataset.tab;
  document.querySelectorAll(".tab").forEach((x) => x.setAttribute("aria-selected", String(x === b)));
  render();
}));

async function act(p, status, btn) {
  const draft = edits.get(p.id);
  const patch = status === p.status ? {} : { status };
  if (draft) {
    const text = draft.text.trim();
    if (!text) { alertCard(btn, "빈 기도는 송출할 수 없습니다."); return; }
    patch.text = text.slice(0, MAX_TEXT);
    patch.name = draft.name.trim().slice(0, MAX_NAME);
  }
  btn.disabled = true;
  try { await store.update(p.id, patch); edits.delete(p.id); }
  catch (err) { console.error(err); alertCard(btn, "저장하지 못했습니다. 다시 눌러 주세요."); btn.disabled = false; }
}
function alertCard(btn, msg) {
  const box = btn.closest(".card").querySelector(".error");
  box.textContent = msg; box.hidden = false;
}

function render() {
  for (const s of Object.keys(LABEL)) $("n-" + s).textContent = all.filter((p) => p.status === s).length;
  $("bulk").hidden = tab !== "approved" || !all.some((p) => p.status === "approved");
  const items = all.filter((p) => p.status === tab);
  if (tab === "approved") items.sort((a, b) => a.approvedAt - b.approvedAt);
  const list = $("list");
  const active = document.activeElement;
  const focused = active?.dataset?.key, caret = active?.selectionStart;
  list.replaceChildren();
  if (!items.length) {
    const e = document.createElement("p"); e.className = "empty";
    e.textContent = tab === "pending" ? "새로 올라온 기도가 없습니다. 성도용 페이지에서 올리면 여기에 바로 나타납니다." : `${LABEL[tab]} 기도가 없습니다.`;
    list.append(e); return;
  }
  for (const p of items) list.append(card(p));
  const again = focused && list.querySelector(`[data-key="${focused}"]`);
  if (again) { again.focus(); if (caret != null) again.setSelectionRange(caret, caret); }
}

function card(p) {
  const draft = edits.get(p.id) || { text: p.text, name: p.name || "" };
  const el = document.createElement("article");
  el.className = "card"; el.dataset.status = p.status;

  const meta = document.createElement("div"); meta.className = "meta";
  const who = document.createElement("b"); who.textContent = p.name || "익명";
  const when = document.createElement("span"); when.textContent = fmt(p.createdAt);
  meta.append(who, when);

  const ta = document.createElement("textarea");
  ta.value = draft.text; ta.maxLength = MAX_TEXT; ta.dataset.key = p.id + ":t";
  ta.setAttribute("aria-label", "기도 내용 (고쳐서 송출할 수 있습니다)");
  const nm = document.createElement("input");
  nm.value = draft.name; nm.maxLength = MAX_NAME; nm.placeholder = "이름 (비우면 익명)"; nm.dataset.key = p.id + ":n";
  nm.setAttribute("aria-label", "이름");
  const keep = () => edits.set(p.id, { text: ta.value, name: nm.value });
  ta.addEventListener("input", keep); nm.addEventListener("input", keep);

  const actions = document.createElement("div"); actions.className = "actions";
  const add = (label, cls, status) => {
    const b = document.createElement("button"); b.type = "button"; b.textContent = label;
    if (cls) b.className = cls;
    b.addEventListener("click", () => act(p, status, b));
    actions.append(b);
  };
  if (p.status === "pending") { add("송출", "ok", "approved"); add("숨김", "", "hidden"); }
  if (p.status === "approved") { add("고친 내용 저장", "", "approved"); add("송출에서 내리기", "", "hidden"); }
  if (p.status === "hidden") { add("송출", "ok", "approved"); add("대기로 되돌리기", "", "pending"); }
  if (p.status === "done") { add("다시 송출", "ok", "approved"); }
  actions.append(nm);

  const err = document.createElement("p"); err.className = "error"; err.hidden = true;
  el.append(meta, ta, actions, err);
  return el;
}

$("clear").addEventListener("click", () => { $("clearYes").hidden = false; });
$("clearYes").addEventListener("click", async () => {
  $("clearYes").disabled = true;
  try { await Promise.all(all.filter((p) => p.status === "approved").map((p) => store.update(p.id, { status: "done" }))); }
  finally { $("clearYes").disabled = false; $("clearYes").hidden = true; }
});
</script>
</body>
</html>
