<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>기도 송출 화면</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* 화면 전체를 채우는 무대 하나. 하늘·분홍·보라 빛이 천천히 섞이는 밝은 바탕에 기도 한 장 */
:root {
  --sky: #bfe3ff;
  --pink: #ffd3e6;
  --lilac: #dccdff;
  --mist: #f7f5ff;
  --ink: #1a1f5c;
  --soft: #6a6f9c;
  --red: #e5004f;
  --font-display: "Gowun Batang", "Nanum Myeongjo", serif;
  --font-ui: "Gowun Batang", "Nanum Myeongjo", serif;
  --fade: 1400ms;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--mist); overflow: hidden; }
body { display: grid; place-items: center; color: var(--ink); font-family: var(--font-ui); }
body.idle { cursor: none; }
.stage {
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  position: relative;
  container-type: size;
  overflow: hidden;
  background: linear-gradient(135deg, var(--sky), var(--mist) 45%, var(--pink));
  isolation: isolate;
  /* 크기 기준: 16:9에서는 높이의 1%, 화면이 좁아지면 너비에 맞춰 줄어듦 */
  --u: min(1cqh, 0.75cqw);
}
.stage.fixed { width: min(100vw, calc(100dvh * var(--ar))); height: auto; aspect-ratio: var(--ar); }
/* 천천히 떠다니는 빛 세 덩이 */
.aura { position: absolute; inset: -20%; z-index: -1; filter: blur(6cqh); }
.aura i { position: absolute; border-radius: 50%; opacity: .85; mix-blend-mode: multiply; }
.aura i:nth-child(1) { width: 60cqmax; height: 60cqmax; left: 5%; top: 10%; background: radial-gradient(circle, var(--sky), transparent 65%); animation: drift1 38s ease-in-out infinite alternate; }
.aura i:nth-child(2) { width: 55cqmax; height: 55cqmax; right: 2%; top: 0; background: radial-gradient(circle, var(--pink), transparent 65%); animation: drift2 44s ease-in-out infinite alternate; }
.aura i:nth-child(3) { width: 65cqmax; height: 65cqmax; left: 25%; bottom: -5%; background: radial-gradient(circle, var(--lilac), transparent 65%); animation: drift3 50s ease-in-out infinite alternate; }
@keyframes drift1 { to { transform: translate(18cqw, 12cqh) scale(1.15); } }
@keyframes drift2 { to { transform: translate(-20cqw, 18cqh) scale(.9); } }
@keyframes drift3 { to { transform: translate(-12cqw, -16cqh) scale(1.1); } }
/* 위에서 비껴 들어오는 빛줄기 */
.rays { position: absolute; inset: -30cqh -20cqw 0; z-index: -1; pointer-events: none;
  background: repeating-conic-gradient(from 160deg at 42% 0%, rgba(255,255,255,0) 0deg, rgba(255,255,255,.75) 2.5deg, rgba(255,250,253,.2) 5deg, rgba(255,255,255,0) 8deg, rgba(255,255,255,0) 12deg);
  -webkit-mask-image: radial-gradient(95% 110% at 42% 0%, #000 15%, transparent 80%);
          mask-image: radial-gradient(95% 110% at 42% 0%, #000 15%, transparent 80%);
  filter: blur(.7cqh); mix-blend-mode: screen; opacity: .95; transform-origin: 42% 0%;
  animation: sway 26s ease-in-out infinite alternate, breathe 9s ease-in-out infinite alternate; }
.glow { position: absolute; left: 30%; top: -30cqh; width: 60cqmax; height: 60cqmax; z-index: -1; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, rgba(255,255,255,.95), rgba(255,247,252,.5) 35%, transparent 70%); animation: breathe 9s ease-in-out infinite alternate; }
@keyframes sway { from { transform: rotate(-4deg); } to { transform: rotate(5deg); } }
@keyframes breathe { from { opacity: .6; } to { opacity: 1; } }
/* 떠오르는 빛 알갱이 */
.motes { position: absolute; inset: 0; z-index: -1; pointer-events: none; }
.motes i { position: absolute; bottom: -2cqh; width: var(--s); height: var(--s); border-radius: 50%;
  background: radial-gradient(circle, #fff, rgba(255,255,255,0) 70%); opacity: 0;
  animation: rise var(--d) linear var(--delay) infinite; }
@keyframes rise { 0% { transform: translate(0, 0); opacity: 0; } 15% { opacity: .9; } 85% { opacity: .7; } 100% { transform: translate(var(--x), -105cqh); opacity: 0; } }
.logo { position: absolute; top: 4.6cqh; left: 5cqw; height: calc(5.2 * var(--u)); width: auto; }
.title {
  position: absolute; top: 5cqh; left: 0; right: 0; text-align: center;
  font: 500 calc(2.4 * var(--u)) var(--font-ui); letter-spacing: .32em; color: var(--ink);
}
.title::after { content: ""; display: block; width: 4cqw; height: 3px; border-radius: 3px; background: var(--red); margin: calc(1.8 * var(--u)) auto 0; }
.slide {
  position: absolute; inset: 15cqh 12cqw 20cqh; display: grid; place-content: center; gap: calc(5 * var(--u)); text-align: center;
  opacity: 0; transform: translateY(2cqh); transition: opacity var(--fade) ease, transform var(--fade) ease;
}
.slide.on { opacity: 1; transform: none; }
.slide .text { font: 400 var(--size, calc(5.6 * var(--u)))/1.65 var(--font-display); margin: 0; text-wrap: balance; word-break: keep-all; overflow-wrap: anywhere; color: var(--ink); text-shadow: 0 0 calc(3 * var(--u)) rgba(255,255,255,.8); }
.slide .who { font: 500 calc(2.8 * var(--u)) var(--font-ui); color: var(--red); letter-spacing: .06em; margin: 0; }
.slide .who::before { content: "— "; }
.slide.welcome .who { color: var(--soft); font-weight: 400; }
.slide.welcome .who::before { content: none; }
.foot { position: absolute; left: 6cqw; right: 6cqw; bottom: 5.5cqh; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: calc(3 * var(--u)); }
.progress { flex: 1; display: grid; gap: calc(1.4 * var(--u)); }
.count { font: 400 calc(2 * var(--u)) var(--font-ui); color: var(--soft); font-variant-numeric: tabular-nums; letter-spacing: .08em; }
.qr { display: flex; align-items: center; gap: calc(2.8 * var(--u)); margin-left: auto; }
.qr .label { font: 400 calc(2.2 * var(--u))/1.5 var(--font-ui); color: var(--soft); text-align: right; }
.qr .label b { display: block; color: var(--red); font-weight: 700; font-size: calc(2.6 * var(--u)); }
.qr .code { background: #fff; padding: calc(.8 * var(--u)); border-radius: calc(1 * var(--u)); width: calc(13 * var(--u)); height: calc(13 * var(--u)); box-shadow: 0 calc(.6 * var(--u)) calc(2 * var(--u)) rgba(26, 31, 92, .12); }
.qr .code img, .qr .code canvas { width: 100% !important; height: 100% !important; display: block; }
@media (prefers-reduced-motion: reduce) { .slide { transition: opacity 300ms linear; transform: none; } .aura i, .rays, .glow { animation: none; } .motes { display: none; } }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="aura" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="rays" aria-hidden="true"></div>
  <div class="glow" aria-hidden="true"></div>
  <div class="motes" id="motes" aria-hidden="true"></div>
  <img class="logo" src="logo-sarang.png" alt="사랑의교회">
  <div class="title" id="title">오늘 함께 드리는 기도</div>
  <section class="slide" id="a"><p class="text"></p><p class="who"></p></section>
  <section class="slide" id="b"><p class="text"></p><p class="who"></p></section>
  <div class="foot">
    <div class="progress"><div class="count" id="count"></div></div>
    <div class="qr" id="qr"><div class="label"><b>기도를 올려 주세요</b>휴대폰 카메라로 찍으면 됩니다</div><div class="code" id="code"></div></div>
  </div>
</div>

<script type="module">
import store from "./store.js";
import { SLIDE_SECONDS, SCREEN_TITLE, SUBMIT_URL } from "./config.js";

const params = new URLSearchParams(location.search);
const SEC = Math.max(4, Number(params.get("sec")) || SLIDE_SECONDS);
const $ = (id) => document.getElementById(id);
$("title").textContent = SCREEN_TITLE;

// 기본은 화면 전체를 채움. ?ratio=16:9, ?ratio=4:3 처럼 주면 그 비율로 고정
const ratio = (params.get("ratio") || "").match(/^(\d+(?:\.\d+)?)[:x/](\d+(?:\.\d+)?)$/);
if (ratio) { $("stage").classList.add("fixed"); $("stage").style.setProperty("--ar", `${ratio[1]} / ${ratio[2]}`); }

// 빛 알갱이 뿌리기
for (let i = 0; i < 22; i++) {
  const m = document.createElement("i");
  const r = (a, b) => a + Math.random() * (b - a);
  m.style.cssText = `left:${r(0, 100)}%;--s:${r(0.6, 1.8).toFixed(2)}cqmin;--d:${r(18, 34).toFixed(1)}s;--delay:${(-r(0, 34)).toFixed(1)}s;--x:${r(-8, 8).toFixed(1)}cqw`;
  $("motes").append(m);
}

// QR: 성도용 페이지 주소
const submitUrl = SUBMIT_URL || new URL("./", location.href).href;
if (params.get("qr") === "0" || !window.QRCode) $("qr").hidden = true;
else new QRCode($("code"), { text: submitUrl, width: 256, height: 256, colorDark: "#1a1f5c", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M });

// 재생 상태: 승인된 기도를 승인 순으로 한 번씩만 보여 주고, 다 나가면 안내 화면에서 기다림
let prayers = [];          // 승인된 기도(승인 순)
let currentId = null, paused = false, timer = 0, loaded = false;
const layers = [$("a"), $("b")];
let front = 0;

const WELCOME = { id: "__welcome", text: "올려 주신 기도를 함께 나눕니다", name: "" };

// 이미 나간 기도. 새로고침해도 다시 나오지 않도록 이 기기에 적어 둠
const PLAYED_KEY = "gido-played-v1";
let played = new Set();
try { played = new Set(JSON.parse(localStorage.getItem(PLAYED_KEY)) || []); } catch {}
const savePlayed = () => { try { localStorage.setItem(PLAYED_KEY, JSON.stringify([...played])); } catch {} };

function sizeFor(text) {
  const n = [...text].length;
  if (n <= 30) return "calc(7 * var(--u))";
  if (n <= 60) return "calc(6 * var(--u))";
  if (n <= 110) return "calc(5 * var(--u))";
  if (n <= 180) return "calc(4.2 * var(--u))";
  return "calc(3.6 * var(--u))";
}

function updateCount() {
  const i = prayers.findIndex((x) => x.id === currentId);
  $("count").textContent = i >= 0 ? `${i + 1} / ${prayers.length}` : "";
}

function paint(p) {
  if (p.id === currentId) return;
  const next = layers[1 - front], cur = layers[front];
  const welcome = p.id === WELCOME.id;
  next.querySelector(".text").textContent = p.text;
  next.querySelector(".who").textContent = welcome ? "화면 오른쪽 아래 QR로 기도를 올릴 수 있습니다" : (p.name || "익명의 기도");
  next.style.setProperty("--size", welcome ? "calc(6.4 * var(--u))" : sizeFor(p.text));
  next.classList.toggle("welcome", welcome);
  cur.classList.remove("on");
  next.classList.add("on");
  front = 1 - front;
  currentId = p.id;
  if (!welcome) { played.add(p.id); savePlayed(); }
  updateCount();
}

// 다음 기도(아직 안 나간 것 중 가장 먼저 승인된 것)를 보여 주고, 없으면 안내 화면
function advance() {
  clearTimeout(timer);
  const next = prayers.find((p) => !played.has(p.id));
  paint(next || WELCOME);
  if (next && !paused) timer = setTimeout(advance, SEC * 1000);
}

store.watchApproved((list) => {
  prayers = list;
  // 송출 목록에서 내려간 기도는 기록에서 지움(나중에 '다시 송출'하면 다시 나오도록)
  const ids = new Set(list.map((p) => p.id));
  let changed = false;
  for (const id of played) if (!ids.has(id) && id !== currentId) { played.delete(id); changed = true; }
  if (changed) savePlayed();

  if (!loaded) { loaded = true; advance(); return; }
  if (currentId === WELCOME.id) { advance(); return; }          // 기다리던 중 새 기도가 들어옴
  if (!ids.has(currentId)) { advance(); return; }                // 지금 기도가 송출에서 내려감
  const now = prayers.find((p) => p.id === currentId);           // 지금 기도의 글이 고쳐짐
  const layer = layers[front];
  if (now && layer.querySelector(".text").textContent !== now.text) {
    layer.querySelector(".text").textContent = now.text;
    layer.style.setProperty("--size", sizeFor(now.text));
  }
  updateCount();
}, (err) => {
  console.error(err);
  $("count").textContent = "연결이 끊겼습니다. 인터넷을 확인해 주세요.";
});

// 조작: → 다음 기도로 넘기기, 스페이스 멈춤
addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" || e.key === "PageDown") advance();
  else if (e.key === " ") {
    e.preventDefault(); paused = !paused;
    clearTimeout(timer);
    if (!paused) timer = setTimeout(advance, SEC * 1000);
  }
  else if (e.key === "f") toggleFull();
});
$("stage").addEventListener("click", toggleFull);
function toggleFull() {
  if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {});
  else document.documentElement.requestFullscreen?.().catch(() => {});
}

// 커서·안내 숨김, 화면 꺼짐 방지
let idleT = 0;
const wake = () => { document.body.classList.remove("idle"); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add("idle"), 3000); };
addEventListener("mousemove", wake); wake();
let lock = null;
async function keepAwake() { try { lock = await navigator.wakeLock?.request("screen"); } catch {} }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") keepAwake(); });
keepAwake();
</script>
</body>
</html>
